spring.application.name=identity-server

server.port=${PORT:3101}
spring.data.mongodb.uri=${MONGO_URI}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Path prefix routes are mounted under, e.g. BASE_API_URL=api -> /api/...
# (referenced via ${BASE_API_URL:api} placeholders in each @RequestMapping).
BASE_API_URL=${BASE_API_URL:api}

spring.jackson.serialization.write-dates-as-timestamps=false
