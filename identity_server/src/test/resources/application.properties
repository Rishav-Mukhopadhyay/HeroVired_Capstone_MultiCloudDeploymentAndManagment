# Test-only overrides — hermetic, no dependency on the real .env/Atlas
# credentials. Repositories/MongoTemplate are @MockBean'd in tests that
# start a Spring context, so this URI is never actually connected to; it
# only needs to satisfy property placeholder resolution at context startup.
spring.data.mongodb.uri=mongodb://localhost:27017/test-db
app.jwt.secret=test-secret-must-be-at-least-32-bytes-long-1234567890
app.jwt.expiration-ms=604800000
BASE_API_URL=api
